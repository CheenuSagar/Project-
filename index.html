<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/react.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABES AcademiX | MCA III Sem Timetable & Live Attendance</title>
    <meta name="description" content="Official ABES Engineering College MCA 3rd Semester Timetable, Target Attendance Simulator, and Live Period Notifications." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('ABES AcademiX Offline SW Registered:', reg.scope))
            .catch(err => console.error('SW Registration Failed:', err));
        });
      }
    </script>
  </body>
</html>
